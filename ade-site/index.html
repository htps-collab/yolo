    <!-- Sharing. Swap the og:image / og:url values for absolute URLs once the

    <meta property="og:site_name" content="HIFI 609 × Sesh Dawgs United" />

         Mixed attendance because the sets are also livestreamed. -->

        "name": "Sesh Dawgs United at HIFI 609 — ADE Pop-Up",

        "endDate": "2026-10-24T19:00:00+02:00",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
        "location": [
          {
            "@type": "Place",
            "name": "HIFI 609",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Herengracht 609",
              "addressLocality": "Amsterdam",
              "addressCountry": "NL"

          { "@type": "VirtualLocation", "url": "https://www.youtube.com/@HiFiAmsterdam" }
        ],
        "image": ["/og.jpg"],
        "performer": [
          { "@type": "Person", "name": "MCR-T" },
          { "@type": "Person", "name": "DJ Cringey" },
          { "@type": "Person", "name": "DJ Hyperdrive" },
          { "@type": "Person", "name": "Clara Cuvé" }

        "organizer": [

          { "@type": "Organization", "name": "Sesh Dawgs United", "url": "https://sesh.group/" }

    <link rel="preconnect" href="https://www.amsterdam-monumentenstad.nl" />
